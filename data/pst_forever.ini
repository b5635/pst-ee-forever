; pst_forever settings. A missing file or 0 everywhere = vanilla game.

[voice]
; Play the TLK sound of info-point ("examine", ? cursor) text when it is clicked.
examine=1

[tbc]
; Turn-based combat. 0 = vanilla real-time combat (no hooks installed).
enabled=1
; Virtual-key code that ends the current party member's turn (0x23 = End).
end_turn_key=0x23
; Engine distance units (pixels on the isometric ellipse dx^2 + 16*dy^2/9 <= r^2, as the engine's
; own "enemies nearby" check): a hostile this close to the party starts a fight; creatures this close
; join; a hostile farther than leave_radius from every party member has left the fight.
start_radius=450
join_radius=650
leave_radius=1100
; Party AI: party members attack the nearest enemy on their turn (env PSTF_TBC_AUTOPARTY=1 too).
auto_party=0
; Movement per turn in feet (1 ft = 16 px across, 12 px up/down: one search-map cell).
move_feet=31
; BG3-style HUD: initiative bar with bestiary pictures (red fills them with damage), action + movement
; panel, movement line (party only), hotbar with every weapon/spell/item/ability, hover card (name, HP,
; hit chance).
hud=1
; d20 panel for attack rolls and saving throws (off: the engine's own feedback lines only).
dice_panel=0
; Success/fail sound (pst_forever\sounds\save_*.wav) with the engine's "Save vs. ...: N" line.
save_sounds=1
; Effects tick in rounds: a buff, debuff or damage over time advances one round (round_seconds of its
; time) at the start of its owner's turn and never in between; spells cast on a waiting creature land
; at once; a spell's projectile moves only in its caster's turn, and the caster's turn waits for it.
round_effects=1
round_seconds=5
; Everyone runs in a fight; creatures without a run animation walk at this move scale (run speed).
run=1
run_scale=11
; Keep the battle song playing for the whole fight.
battle_music=1
; Quick camera pan to whoever's turn it is; the camera follows the creature while it moves.
camera_follow=1
; With [smooth] interpolation on, follow the position the creature is DRAWN at, once per drawn frame:
; the camera eases onto the creature by real time, then locks on so it stands still on screen while it
; walks. 0 = the camera keeps its tick-rate motion (jaggy running against interpolated movers).
camera_smooth=1
; Line of sight to everyone in the fight: combatants out of the party's view are shown (fog lifts
; around them) until the fight ends.
combat_sight=1

[smooth]
; Sub-tick frame interpolation: creatures and spell projectiles are drawn sliding along their last step
; instead of jumping once per step (Torment lands a walker's step every other world tick: 15 steps/s at
; fps 30). Game logic, scripts, saves and combat timing stay exactly vanilla (1 tick = 1000/fps ms);
; movement is displayed one step interval behind the state (2 ticks for a walker). 0 = vanilla: no hooks.
interpolation=1
; Draw frames per second. 0 = the display's refresh rate. The world keeps EE's exact tick rate; the
; extra iterations draw only. Never below the tick rate.
frame_rate=0
; The engine's lock camera (HUD scroll-lock button) follows the position the creature is shown at, so
; the creature stays still on screen and the world glides. 0 = the lock camera jumps once per tick.
lock_camera=1

[dev]
; Register PSTF_* probe functions in the engine's Lua state (in-game console, luaAuto.cfg).
; Read-only queries; results are also written to pst_forever\logs\pst_forever.log.
lua=1
; Load a save without input: press "Continue" on the start screen (the save Baldur.lua names in
; 'Game Options','Last Save PST'), then run `autorun` (a Lua file) once the world is up.
; tools\launch.ps1 sets these per launch through PSTF_AUTOLOAD / PSTF_RUN_LUA instead.
autoload=0
autorun=

[lighting]
; Dynamic lighting from the baked scene data in pst_forever\assets\lighting\<WED>\ (lights.txt,
; height.bin, normal.bin, ao.bin). Presentation only: the engine's LM tint (stealth) is untouched.
; 0 = vanilla: no hooks at all.
enabled=0
; Baked lights (fires, magic, pools), flickering by kind. light_gain in percent.
baked_lights=1
light_gain=100
; How much darker than the original the unlit parts get: 0 = original brightness, 100 = default.
ambient=100
; Height map: lights reach up walls and stop behind them (occlusion ray march, 4..32 steps).
height_map=1
occlusion=1
occlusion_steps=16
; Area normal maps shape the light on walls and floors (normal_strength 0..100).
area_normals=1
normal_strength=80
; Tint the ambient with the area's key-light colour.
key_light=1
; Cap of ambient + lights (percent) and how much of very bright pixels escapes the darkening.
max_light=125
highlight_keep=60
; Phase 4. Glow draws (additive BAM draws: fires, spells, projectiles) keep their own brightness
; (emissive_keep %), bloom (bright pass under the glow draws, strength %), and light the scene
; (fx_lights, colour per frame from pst_foreverssetsfxfxauto.tsv by toolsfxscan.py).
emissive=1
emissive_keep=80
bloom=1
bloom_strength=35
bloom_threshold=45
fx_lights=1
fx_light_gain=100
fx_budget=24
; Hand lights (pst_foreverssetsfxfxlight.tsv): BAM patterns that always carry a light (Ignus).
hand_lights=1
hand_light_gain=150
; Buff colour lights: creatures with a colour glow/pulse/fade effect or a buff's screen tint carry a light
; of that colour.
buff_lights=1
buff_light_gain=70
; Phase 5. Atmosphere v1: surfaces high above the floor (walls, spires, far backdrops) fade a little
; toward the area's haze colour (height 200..1024 px). Strength in percent.
atmosphere=1
atmosphere_strength=100
; 0 lit, 1 light buffer only, 2 round trip (copy + draw back, must be pixel-identical), 3 falloff, 4 off, 5 emissive mask (red) + bloom (green).
debug=0
