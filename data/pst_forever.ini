; pst_forever settings. A missing file or 0 everywhere = vanilla game.

[voice]
; Play the TLK sound of info-point ("examine", ? cursor) text when it is clicked.
examine=1
; A new examine line or a dialogue opening stops the examine line still playing; closing a
; dialogue stops its voice (vanilla lets the last line run on).
cut=1

[tbc]
; Turn-based combat. 0 = vanilla real-time combat (no hooks installed).
enabled=1
; Virtual-key code that ends the current party member's turn (0x23 = End).
end_turn_key=0x23
; Engine distance units (pixels on the isometric ellipse dx^2 + 16*dy^2/9 <= r^2, as the engine's
; own "enemies nearby" check): a hostile this close to the party starts a fight; creatures this close
; join; a hostile farther than leave_radius from every party member has left the fight.
start_radius=450
join_radius=650
leave_radius=1100
; Party AI: party members attack the nearest enemy on their turn (env PSTF_TBC_AUTOPARTY=1 too).
auto_party=0
; Movement per turn in feet (1 ft = 16 px across, 12 px up/down: one search-map cell).
move_feet=31
; BG3-style HUD: initiative bar with bestiary pictures (red fills them with damage), action + movement
; panel, movement line (party only), hotbar with every weapon/spell/item/ability, hover card (name, HP,
; hit chance).
hud=1
; d20 panel for attack rolls and saving throws (off: the engine's own feedback lines only).
dice_panel=0
; Success/fail sound (pst_forever\sounds\save_*.wav) with the engine's "Save vs. ...: N" line.
save_sounds=1
; Effects tick in rounds: a buff, debuff or damage over time advances one round (round_seconds of its
; time) at the start of its owner's turn and never in between; spells cast on a waiting creature land
; at once; a spell's projectile moves only in its caster's turn, and the caster's turn waits for it.
round_effects=1
round_seconds=5
; Everyone runs in a fight; creatures without a run animation walk at this move scale (run speed).
run=1
run_scale=11
; Keep the battle song playing for the whole fight.
battle_music=1
; Quick camera pan to whoever's turn it is; the camera follows the creature while it moves.
camera_follow=1
; With [smooth] interpolation on, follow the position the creature is DRAWN at, once per drawn frame:
; the camera eases onto the creature by real time, then locks on so it stands still on screen while it
; walks. 0 = the camera keeps its tick-rate motion (jaggy running against interpolated movers).
camera_smooth=1
; Line of sight to everyone in the fight: combatants out of the party's view are shown (fog lifts
; around them) until the fight ends.
combat_sight=1
; Pixels of fog lifted around each foe in the fight (a party member's own sight is 14 x 32 = 448);
; foes are also drawn wherever they stand, as Clairvoyance shows them.
sight_radius=448
; A party member's turn plays its selection voice line (as a portrait click does).
select_voice=1
; No bored voice lines while a fight runs.
no_bored=1
; BG3 layout of the bottom bar (also on the inventory, character... screens): party portraits in a
; column on the left edge with buff/debuff icons beside them, the hotbar (turn-based moves, weapons,
; spells, items, abilities; 2 rows a page, page arrows) where they were, the turn strip (action, attacks,
; movement) and End Turn inside the bar, no weapon/spell/item/ability select buttons. 0 = the engine's own
; bar (hotbar in fights only).
bg3_layout=1
; Maneuvers on the hotbar and for the AI: Run (action: +max movement), Withdraw (action: a third of the movement
; left, walks, no attacks of opportunity), Trip (fighters: first melee swing -2, a hit trips instead of
; damage, save vs death or knocked down until its next turn: +4 to hit it), Block (fighters but Morte: the round's attacks
; become blocks against melee hits). AI creatures with THAC0 15 or better also knock down.
maneuvers=1
; Run/Withdraw ground effects (rings, dust, smoke) soft and translucent under the creatures (0 = engine lines
; drawn over them).
ground_fx=1
; A walk that starts in an enemy's melee reach and leaves it (without Withdraw): the walker turns toward its way and
; waits, every such enemy swings once (one after the other, once until its next turn), then it walks.
opportunity_attacks=1
; Missile of Patience (caster level 11+, it hovers for targets): shots in a fight; the turn waits while it hovers
; (End Turn ends it). 0 = the engine's own (any number until it expires).
mop_shots=3
; In a fight, walkers never push a combatant aside (as the engine never pushes enemies): no running in place.
no_push=1

[smooth]
; Sub-tick frame interpolation: creatures and spell projectiles are drawn sliding along their last step
; instead of jumping once per step (Torment lands a walker's step every other world tick: 15 steps/s at
; fps 30). Game logic, scripts, saves and combat timing stay exactly vanilla (1 tick = 1000/fps ms);
; movement is displayed one step interval behind the state (2 ticks for a walker). 0 = vanilla: no hooks.
interpolation=1
; Draw frames per second. 0 = the display's refresh rate. The world keeps EE's exact tick rate; the
; extra iterations draw only. Never below the tick rate.
frame_rate=0
; The engine's lock camera (HUD scroll-lock button) follows the position the creature is shown at, so
; the creature stays still on screen and the world glides. 0 = the lock camera jumps once per tick.
lock_camera=1

[dev]
; Register PSTF_* probe functions in the engine's Lua state (in-game console, luaAuto.cfg).
; Read-only queries; results are also written to pst_forever\logs\pst_forever.log.
lua=1
; Load a save without input: press "Continue" on the start screen (the save Baldur.lua names in
; 'Game Options','Last Save PST'), then run `autorun` (a Lua file) once the world is up.
; tools\launch.ps1 sets these per launch through PSTF_AUTOLOAD / PSTF_RUN_LUA instead.
autoload=0
autorun=

[lighting]
; Dynamic lighting from the baked scene data in pst_forever\assets\lighting\<WED>\ (lights.txt,
; height.bin, normal.bin, ao.bin). Presentation only: the engine's LM tint (stealth) is untouched.
; 0 = vanilla: no hooks at all.
enabled=0
; Baked lights (fires, magic, pools), flickering by kind. light_gain in percent.
baked_lights=1
light_gain=100
; How much darker than the original the unlit parts get: 0 = original brightness, 100 = default.
ambient=100
; Day / night (areas with the engine's day/night cycle): the engine's time-of-day tint is taken back out
; of the scene and replaced by our own light: cool moonlight at night (night_level % of the day ambient),
; a warm cast at dusk and dawn (dusk_warmth %), dynamic lights stronger at night (night_light_gain %),
; and the area lightmap's painted light pools glowing at night (lightmap_night %). night_tint_luma = the
; luma (%) of the engine's full-night tint, where our night is complete. 0 = the engine's own tint.
day_night=1
night_level=45
night_light_gain=150
dusk_warmth=35
lightmap_night=60
night_tint_luma=43
; Height map: lights reach up walls and stop behind them (occlusion ray march, 4..32 steps).
height_map=1
occlusion=1
occlusion_steps=16
; Area normal maps shape the light on walls and floors (normal_strength 0..100).
area_normals=1
normal_strength=80
; Tint the ambient with the area's key-light colour.
key_light=1
; Cap of ambient + lights (percent) and how much of very bright pixels escapes the darkening.
max_light=125
highlight_keep=60
; Phase 4. Glow draws (additive BAM draws: fires, spells, projectiles) keep their own brightness
; (emissive_keep %), bloom (bright pass under the glow draws, strength %), and light the scene
; (fx_lights, colour per frame from pst_forever\assets\vfx\vfxauto.tsv by tools\vfxscan.py).
emissive=1
emissive_keep=80
bloom=1
bloom_strength=35
bloom_threshold=45
fx_lights=1
fx_light_gain=100
; Colour strength of effect lights (percent; 100 = the sprite's own colour mix, which is pale for
; white-hot spell cores).
fx_light_saturation=160
fx_budget=24
; Effect BAMs drawn with the normal (opaque) blend use the screen blend instead: their dark parts let
; the scene through, so spell visuals read as light instead of solid paint. Creatures are never changed.
fx_soften=1
; At night the engine's tint is taken out of the scene and replaced by our ambient; pixels the engine drew
; without the tint (most spell effects) are kept as drawn instead (0 = old look: spells turn blue at night).
untinted_fx=1
; Creatures with a 'glow' hand light (Ignus, data/vfxlight.tsv) show all their pixels at their daytime
; brightness at night, not only their bright ones (0 = the dark parts are lit like any creature).
self_lit=1
; The glow look on top of each effect's own pixels (emissive map = brightness x saturation of the drawn
; effect): fx_boost = how far glowing pixels shine past their colour (percent), fx_fringe = colour
; fringe of the halo (px, 0 = off), bloom_passes = 1 tight halo .. 3 wide soft halo.
fx_boost=15
fx_fringe=2
bloom_passes=2
; Hand lights (pst_forever\assets\vfx\vfxlight.tsv): BAM patterns that always carry a light, and creature
; lights ("anim:N" rows: fixed at the creature's feet, e.g. Ignus = anim:36, steady).
hand_lights=1
hand_light_gain=150
; Buff colour lights: creatures with a colour glow/pulse/fade effect or a buff's screen tint carry a light
; of that colour.
buff_lights=1
buff_light_gain=70
; Glows held by equipped items (the pulse of magic weapons, e.g. Annah's daggers): a small light of one
; common weapon size (radius px) and strength (percent of buff_light_gain; 0 = none).
weapon_glow_gain=30
weapon_glow_radius=70
; Phase 2. Creatures: per-pixel depth maps (pst_forever\assets\sprites\depth\*.DEP, tools\sprite_depth)
; give them shape under lights; their own LM tint is their ambient (stealth reads the LM unchanged).
; sprite_occlusion: creatures block dynamic lights (their shadows from torches and spells).
; key_shadows: projected silhouette along the area's key light (strength %, length %).
sprite_lighting=1
sprite_normal_strength=60
sprite_light_gain=100
sprite_occlusion=1
key_shadows=1
key_shadow_strength=80
key_shadow_length=85
; How dark a creature's shadow from a dynamic light is (sprite_occlusion), percent: 100 = fully blocked.
sprite_shadow_strength=100
; Our contact shadow: a soft ellipse on the floor at every creature's feet (strength %, radius px,
; flat = height / width %). bam_shadows=0 hides the engine's own blob baked into the creature BAMs
; (palette entry 1); with it on, both draw. bam_shadows needs a restart.
contact_shadows=1
contact_shadow_strength=70
contact_shadow_size=22
contact_shadow_flat=50
bam_shadows=0
; Sprite AO (ao.bin): a creature in a corner, under an arch or beside a slab loses this share (percent) of
; its ambient where the area is enclosed; the light of torches and spells on it is not reduced. 0 = off.
sprite_ao=60
; Painted lamps, torches and braziers (the baked lights' emitters in the background art) keep their own
; brightness and bloom like glowing effects: painted_glow_gain in percent, painted_glow_size = the glowing
; core as a percent of the light's radius (8..48 px).
painted_glow=1
painted_glow_gain=100
painted_glow_size=20
; Hand-placed area lights (pst_forever\assets\lighting\arealights.tsv) for areas the generated data missed.
area_lights=1
; Most baked lights drawn per frame.
light_budget=64
; Phase 5. Atmosphere v1: surfaces high above the floor (walls, spires, far backdrops) fade a little
; toward the area's haze colour (height 200..1024 px). Strength in percent.
atmosphere=1
atmosphere_strength=100
; 0 lit, 1 light buffer only, 2 round trip (copy + draw back, must be pixel-identical), 3 falloff, 4 off, 5 emissive mask (red) + bloom (green),
; 6 creatures (violet), engine shadow blobs (green), key shadows (yellow).
debug=0

[gore]
; Material hit effects instead of the engine's blood animations: what a creature is made of (RESDATA.INI
; "armor", refined by pst_forever\assets\gore\hitmat.2da) decides blood (flesh, leather), blood and sparks
; (armour over a body), sparks (Vhailor, constructs), bone dust and chips (Morte, skeletons), grit (stone),
; wisps (spirits), smoke (shadows) or embers (Ignus). Blood and chips land as stains / debris under the actors.
; 0 = vanilla: no hooks at all.
enabled=1
; 0 = keep the engine's blood animations (the hook only watches).
custom_blood=1
; Critical hits keep their own animation and get an exaggerated spray on top.
crits=1
; Seconds a stain or debris stays on the floor; particle size in percent; particle budget.
linger=30
particle_scale=150
max_particles=1500

[party]
; 8-member party: TNO and all seven companions at once (the engine's party arrays moved and grown
; to 8 slots; joining, leaving, scripts, saves and portraits use the engine's own code). 0 = vanilla.
; size=8 also gives the BG3 portrait column 8 slots ([tbc] bg3_layout). Single player only.
enabled=1
size=8

[rolls]
; The d20 of the roll panel (dialogue and lock rolls) is a real-time 3D die: it tumbles, lands on the
; rolled face, turns to show the total. 0 = the pre-rendered BAM die.
die_3d=1

[dialogue]
; BG3 style ability rolls: a reply hidden only because the Nameless One's STR/DEX/CON/INT/WIS/CHA is too
; low is listed obscured; click it to roll d20 + (ability - 10) / 2 against max(10, (needed - 10) * 2)
; (natural 20 wins, 1 loses). A win opens the node's replies as if the ability were the needed value, for
; this node only. 0 = vanilla: no hooks.
rolls=1
; pst_forever\sounds\check_success.wav / check_failed.wav with the roll.
roll_sounds=1

[locks]
; BG3 style lock rolls: a party member who reaches a locked door or chest to pick it (thief ability) or bash
; it (attack cursor) gets the d20 roll panel (the game pauses). Lockpicking: d20 + lockpicking / 5 + luck
; against 10 + difficulty / 5. Bashing: d20 + (STR - 10) / 2 (+1..+3 for 18/xx) + luck against
; 12 + difficulty / 4. Natural 20 opens, 1 fails. Difficulty 100 locks need their key (vanilla). 0 = vanilla.
rolls=1
; pst_forever\sounds\check_success.wav / check_failed.wav with the roll.
roll_sounds=1
; After a failed roll that character can try the same lock again after this many game hours (a rest
; passes 8). 0 = retry at once.
retry_hours=1
