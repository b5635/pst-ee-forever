# SPDX-License-Identifier: GPL-2.0-or-later
# Push a tag like v0.1.0 -> build, unit tests, zip (tools/package.ps1), GitHub release with the zip.
# Run it by hand from the Actions tab (workflow_dispatch) to get the zip as a build artifact only.
# Not in CI: pstf_verify (needs the game's Torment.exe) and the lighting/sprite assets (not in git;
# build that zip locally: tools\package.ps1 -Assets '<game>\pst_forever\assets', upload it to the release).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe for the version

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release -- /m /nologo /v:m

      - name: Unit tests
        run: build\Release\pstf_tests.exe

      - name: Package
        shell: powershell
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          & tools\package.ps1 -Version $v
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: pst_forever
          path: build/package/*.zip

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/package/*.zip
          body_path: docs/RELEASE_INSTALL.md
          generate_release_notes: true
